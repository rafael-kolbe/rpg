[package]
name = "protocol"
version = "0.1.0"
description = "Messages exchanged between the game client and the server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
engine = { version = "0.1.0", path = "../engine", features = ["ts"] }
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
world = { version = "0.1.0", path = "../world", features = ["ts"] }

[dev-dependencies]
serde_json = "1.0.154"
