[package]
name = "server"
version = "0.1.0"
description = "Authoritative game server: HTTP API, WebSocket rooms and persistence."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rpg-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
protocol = { version = "0.1.0", path = "../protocol" }
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
